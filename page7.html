<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epomaker - Keysound</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Epomaker</h1>
    </header>
    <main>
        <a href="page1.html"><button type="button">Back to Keysound</button></a>
        <h2>Epomaker keyboards</h2>
        <button type="button" data-sound="assets/audio/eg-oreo-classic.ogg">Epomaker TH66</button>
        <button type="button" data-sound="assets/audio/cherry-mx-brown.ogg">Epomaker TH80</button>
        <button type="button" data-sound="assets/audio/eg-oreo.ogg">Epomaker TH80 Pro</button>
        <button type="button" data-sound="assets/audio/topre-purple.ogg">Epomaker RT100</button>
        <button type="button" data-sound="assets/audio/crystal-purple.ogg">Epomaker CIDOO V75</button>
        <script>
            document.querySelectorAll("[data-sound]").forEach(function (button) {
                var audio = new Audio(button.dataset.sound);
                button.addEventListener("click", function () {
                    if (audio.paused) {
                        audio.currentTime = 0;
                        audio.play();
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            });
        </script>
    </main>
</body>
</html>
