<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corsair - Keysound</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Corsair</h1>
    </header>
    <main>
        <a href="page1.html"><button type="button">Back to Keysound</button></a>
        <h2>Corsair keyboards</h2>
        <button type="button" data-sound="assets/audio/cherry-mx-red.ogg">Corsair K70 RGB</button>
        <button type="button" data-sound="assets/audio/cherry-mx-black.ogg">Corsair K95 RGB</button>
        <button type="button" data-sound="assets/audio/eg-oreo-classic.ogg">Corsair K70 MAX</button>
        <button type="button" data-sound="assets/audio/cherry-mx-brown.ogg">Corsair K65 Plus</button>
        <button type="button" data-sound="assets/audio/cherry-mx-black.ogg">Corsair K100 RGB</button>
        <script>
            document.querySelectorAll("[data-sound]").forEach(function (button) {
                var audio = new Audio(button.dataset.sound);
                button.addEventListener("click", function () {
                    if (audio.paused) {
                        audio.currentTime = 0;
                        audio.play();
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            });
        </script>
    </main>
</body>
</html>
