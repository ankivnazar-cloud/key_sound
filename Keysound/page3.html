<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logitech - Keysound</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Logitech</h1>
    </header>
    <main>
        <a href="page1.html"><button type="button">Back to Keysound</button></a>
        <h2>Logitech keyboards</h2>
        <button type="button" data-sound="assets/audio/topre-purple.ogg">Logitech MX Keys</button>
        <button type="button" data-sound="assets/audio/cherry-mx-red.ogg">Logitech G915</button>
        <button type="button" data-sound="assets/audio/cherry-mx-brown.ogg">Logitech MX Mechanical</button>
        <button type="button" data-sound="assets/audio/eg-oreo.ogg">Logitech G715</button>
        <button type="button" data-sound="assets/audio/cherry-mx-blue.ogg">Logitech G Pro X TKL</button>
        <script>
            document.querySelectorAll("[data-sound]").forEach(function (button) {
                var audio = new Audio(button.dataset.sound);
                button.addEventListener("click", function () {
                    if (audio.paused) {
                        audio.currentTime = 0;
                        audio.play();
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                });
            });
        </script>
    </main>
</body>
</html>
